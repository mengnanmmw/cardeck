name: Build CarDeck APK (Mi10S + VW Sagitar 2026)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Xiaomi 10S (Android 13) & 2026 VW Sagitar Patches
        run: |
          python3 - << 'PY'
          import pathlib, re

          # 1. 降级 minSdk 至 33，支持小米10S 澎湃OS (Android 13)
          gradle_file = pathlib.Path("app/build.gradle.kts")
          if gradle_file.exists():
              text = gradle_file.read_text(encoding="utf-8")
              text = re.sub(r'minSdk\s*=\s*34', 'minSdk = 33', text)
              gradle_file.write_text(text, encoding="utf-8")
              print("[OK] minSdk -> 33")

          src_root = pathlib.Path("app/src/main/java")
          kt_files = list(src_root.rglob("*.kt")) if src_root.exists() else []

          for f in kt_files:
              content = f.read_text(encoding="utf-8")
              orig = content

              # 2. 大众车机 (VW/866/869/Desay/Preh/AQ CAR) 首选 20B MFi 挑战
              if "0xaa02" in content.lower() or "MfiLengthMemory" in content or "challenge" in content:
                  if "audi" in content.lower() and "desay" not in content.lower():
                      content = re.sub(
                          r'(\.contains\(\s*"audi"\s*(?:,\s*ignoreCase\s*=\s*true)?\s*\))',
                          r'\1 || name.contains("vw", ignoreCase = true) || name.contains("aq car", ignoreCase = true) || model.contains("866", ignoreCase = true) || model.contains("869", ignoreCase = true) || manufacturer.contains("desay", ignoreCase = true) || manufacturer.contains("preh", ignoreCase = true)',
                          content,
                          count=1
                      )

              # 3. 清洗 0x4301 IP 字符串尾部 NUL 字节
              if ("0x4301" in content or "CarPlayStartSession" in content) and "trimEnd" not in content:
                  content = content.replace(
                      'Charsets.UTF_8)',
                      'Charsets.UTF_8).trimEnd { it == \'\\u0000\' || it <= \' \' }'
                  )

              # 4. Android 13 虚拟屏强制横屏锁定
              if "set-ignore-orientation-request" in content and "set-fix-to-user-rotation" not in content:
                  content = re.sub(
                      r'(wm\s+set-ignore-orientation-request\s+-d\s+\$[a-zA-Z0-9_]+\s+true)',
                      r'\1; wm set-fix-to-user-rotation enabled; wm user-rotation lock 1',
                      content
                  )

              # 5. 修复音频 EMSGSIZE、骁龙870 VBR 4.8Mbps 降热与大众 12寸屏 1.0x 原生像素对齐
              if f.name == "AudioSender.kt":
                  content = re.sub(r'\b(512|352)\b', '256', content, count=1)
              if f.name == "VideoSender.kt":
                  content = re.sub(r'8_000_000|8000000', '4_800_000', content)
              if "1.5f" in content and ("appHi" in content or "scale" in content.lower()):
                  content = content.replace("1.5f", "1.0f")

              if content != orig:
                  f.write_text(content, encoding="utf-8")
                  print(f"[OK] Patched {f}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate signing keystore
        run: |
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -v \
              -keystore cardeck-mi10s.jks \
              -alias cardeck \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cardeck123 -keypass cardeck123 \
              -dname "CN=CarDeck Mi10S VW, OU=Dev, O=CarDeck, L=CN, ST=CN, C=CN"
            printf "storeFile=../cardeck-mi10s.jks\nstorePassword=cardeck123\nkeyAlias=cardeck\nkeyPassword=cardeck123\n" > keystore.properties
          fi

      - name: Build Debug & Release APKs
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply || true
          ./gradlew :app:assembleDebug :app:assembleRelease -x lint -x lintDebug

      - name: Upload Ready-to-Install APKs
        uses: actions/upload-artifact@v4
        with:
          name: CarDeck-Mi10S-Sagitar2026-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
